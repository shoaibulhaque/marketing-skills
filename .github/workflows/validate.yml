name: Validate manual-only skills
on:
  push:
    paths:
      - 'vendor/**'
      - 'selection.json'
      - 'scripts/validate.py'
      - '.github/workflows/validate.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned official action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify manual-only skills
        run: |
          if test -d vendor/skills; then
            python3 scripts/validate.py
          else
            echo 'Skill sources not yet imported; run Sync selected skills.'
          fi
