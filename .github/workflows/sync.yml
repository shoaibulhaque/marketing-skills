name: Sync selected skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'selection.json'
      - 'scripts/sync.py'
      - 'skill-descriptions.json'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: marketing-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Import pinned and complete upstream skills
        run: python3 scripts/sync.py --profile core
      - name: Validate safeguards and references
        run: python3 scripts/validate.py
      - name: Commit vendored skills when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/skills vendor/UPSTREAM_LICENSE.txt vendor/PROVENANCE.json
          if git diff --cached --quiet; then
            echo 'Already synced.'
          else
            git commit -m 'chore(skills): vendor pinned manual-only marketing skills'
            git push origin HEAD:main
          fi
